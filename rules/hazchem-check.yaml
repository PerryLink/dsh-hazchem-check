# 危险化学品临界量与重大危险源辨识核对 规则库
#
# 规则数据与代码分离：替换本文件即可切换规则集版本，无需改动 TypeScript。
#
# 条款引用纪律（由 shared/ruleset.ts 强制校验）：
#   - 每条规则必须写全 document / number / clause / excerpt / kind / source，
#     且 excerpt 必须是逐字摘录，不得改写。
#   - kind: direct                       条款直接规定了所检查的要求
#   - kind: derived-from-principle       条款未直接规定，仅能由原则性条款推论（severity 最多 warn）
#   - kind: institutional-configuration 阈值出自本机构配置（severity 最多 info）
#
# ⚠️⚠️ 本规则库最要紧的说明：**本插件不内置《危险化学品重大危险源辨识》的临界量表。**
#   本插件核对的是"危险化学品台账与重大危险源辨识记录"的**齐备与算术自洽**：
#     化学品名称与危险性类别是否填写、储存量是否可解析、
#     是否记录了临界量、**"是否重大危险源"的判定是否与储存量和临界量的关系相符**、
#     安全技术说明书编号与保管人是否填写、品名是否残留占位符。
#   其规范载体是**《危险化学品重大危险源辨识》（GB 18218—2018）**、
#   **《危险化学品安全管理条例》（国务院令第591号）**与**《危险化学品目录》**。
#   ⚠️ **GB 18218—2018 的正文与表 1 已逐字核对**（见 rules/evidence/clause-verification-tables.md）：
#      · 版本事实：**2018-11-19 发布 / 2019-03-01 实施**，前言原文「**本标准的全部技术内容为强制性的**」；
#        **代替 GB 18218—2009**（历次版本 GB18218-2000、GB18218-2009，**均已作废，引用即错**）。
#      · 定义：**3.3 临界量**「某种或某类危险化学品构成重大危险源所规定的最小数量」；
#        **3.2 单元**「分成生产单元和储存单元」；**3.4** 危险化学品重大危险源（数量等于或超过临界量的单元）。
#      · **4.1.2** 临界量确定方法：在表 1 范围内按表 1；未在表 1 范围内按表 2；
#        **「若一种危险化学品具有多种危险性，按其中最低的临界量确定」**。
#   ⚠️ **适用范围限制（第 1 章，必须保留）**：**本标准不适用于危险化学品的厂外运输**
#     （铁路、道路、水路、航空、管道等），亦不适用于核设施、军事设施、采矿业（涉及危化品加工工艺及
#     储存活动的除外）与海上石油天然气开采活动。⇒ **拿本插件去核对运输环节的危化品数量即为越界**，
#     运输环节适用危险货物运输法规体系，不是本标准。
#   ⚠️ **表 1 只取得前 35 行，表 2 完全未取得**，故本插件**无法核对临界量取值是否正确**，
#     也**不内置任何临界量数值**。每条 excerpt 仍如实写明"该条文本次未取得"
#     （理由见 rules/evidence/clause-verification-tables.md 第五节），kind 保持 derived-from-principle（封顶 warn）。
#
# ⚠️⚠️ 另一条**必须保留**的边界：**本插件绝不判定某单元是否构成重大危险源、
#   是否应当备案、是否应当做安全评估、是否构成重大隐患**。
#   那需要按 GB 18218 的方法（含**多品种混合物的校正计算**）逐单元计算并报主管部门认定。
#   → **临界量一律取自台账**：本插件读的是台账自己写的"临界量"栏，
#     只核对**储存量与临界量的关系是否与判定相符**。
#     因此它**发现不了"临界量取错了品种或类别"**——这是它最重要的能力边界。
#   → ⚠️ **它更发现不了多品种校正**：GB 18218 的 4.2.1 b) 规定同一单元内多种危险化学品
#     按 S = q₁/Q₁ + q₂/Q₂ + … + qₙ/Qₙ ≥ 1 判定，**本插件不做这个求和**
#     （需要按"生产单元／储存单元"分组，而台账按品种登记、不带单元分组）。
#   → ⚠️ **它也发现不了"多危险性未取最低临界量"**：4.1.2 b) 原文「若一种危险化学品具有多种危险性，
#     按其中最低的临界量确定」，而台账通常只填一个临界量，**取高了就会漏判**。
#   → **危险性类别清单（hazardClasses）与状态清单（states）都出厂为空。**

plugin: dsh-hazchem-check
version: "2026.1"

rules:
  - id: HZ-001
    title: 每种化学品都应填写名称与危险性类别
    severity: warn
    basis:
      document: 《危险化学品安全管理条例》
      number: 国务院令第591号（2002年1月26日国务院令第344号公布，2011年2月16日国务院第144次常务会议修订通过，自2011年12月1日起施行）
      clause: 第二十五条第一款——储存单位应当建立危险化学品出入库核查、登记制度
      excerpt: 储存危险化学品的单位应当建立危险化学品出入库核查、登记制度。对剧毒化学品以及储存数量构成重大危险源的其他危险化学品，储存单位应当将其储存数量、储存地点以及管理人员的情况，报所在地县级人民政府安全生产监督管理部门（在港区内储存的，报港口行政管理部门）和公安机关备案。
      kind: derived-from-principle
      source: https://www.gov.cn/zhengce/2011-03/11/content_2602576.htm
    params:
        check:
          kind: presenceAny
          fields: ["chemicalName","hazardClass"]
          fix: 补填化学品名称与危险性类别；本条只核对是否填写
    note: >-
      台账的**最小单位**是"某种化学品属于哪一类危险特性"：
      缺其一，储存条件、灭火方式与应急措施都无从对应。本次未取得明文条号，故封顶 warn。
      本条只核对"至少填了一个"，**不判断该分类是否正确、是否与名录一致**。

  - id: HZ-002
    title: 储存量应为可解析的数值
    severity: warn
    basis:
      document: 《危险化学品重大危险源辨识》
      number: 国务院令第591号（2002年1月26日国务院令第344号公布，2011年2月16日国务院第144次常务会议修订通过，自2011年12月1日起施行）
      clause: 第二十五条第二款——构成重大危险源的，应当将储存数量、储存地点及管理人员情况报安监部门与公安机关备案
      excerpt: 储存危险化学品的单位应当建立危险化学品出入库核查、登记制度。对剧毒化学品以及储存数量构成重大危险源的其他危险化学品，储存单位应当将其储存数量、储存地点以及管理人员的情况，报所在地县级人民政府安全生产监督管理部门（在港区内储存的，报港口行政管理部门）和公安机关备案。
      kind: derived-from-principle
      source: https://www.gov.cn/zhengce/2011-03/11/content_2602576.htm
      alsoBasis:
        - document: 《危险化学品重大危险源辨识》
          number: GB 18218—2018（2018-11-19发布，2019-03-01实施；全部技术内容为强制性；代替GB 18218—2009）
          clause: 4.2.2——实际存在量按设计最大量确定
          excerpt: 危险化学品储罐以及其他容器、设备或仓储区的危险化学品的实际存在量按设计最大量确定。
          source: http://gf.cabr-fire.com/m/article-27762.htm
    params:
        check:
          kind: number
          field: maxStorage
          fix: 储存量应填写数值；本条只核对可解析性，不判断数量是否真实
    note: >-
      储存量可解析是"与临界量比较"的前提。本次未取得明文条号，故封顶 warn。
      本条**只核对能否解析为数值**（接受 `1.5`、`1,500 kg` 这类写法中的数字部分），
      **不判断该数量是否真实、是否与账面一致**。

  - id: HZ-003
    title: 重大危险源判定应与储存量和临界量的关系相符
    severity: warn
    basis:
      document: 《危险化学品重大危险源辨识》
      number: 国务院令第591号（2002年1月26日国务院令第344号公布，2011年2月16日国务院第144次常务会议修订通过，自2011年12月1日起施行）
      clause: 第十九条末款——重大危险源的定义（数量等于或者超过临界量的单元）
      excerpt: 本条例所称重大危险源，是指生产、储存、使用或者搬运危险化学品，且危险化学品的数量等于或者超过临界量的单元（包括场所和设施）。
      kind: derived-from-principle
      source: https://www.gov.cn/zhengce/2011-03/11/content_2602576.htm
      alsoBasis:
        - document: 《危险化学品重大危险源辨识》
          number: GB 18218—2018（2018-11-19发布，2019-03-01实施；全部技术内容为强制性；代替GB 18218—2009）
          clause: 4.2.1——数量等于或超过表 1、表 2 规定的临界量即定为重大危险源
          excerpt: 生产单元、储存单元内存在危险化学品的数量等于或超过表 1、表 2 规定的临界量，即被定为重大危险源。
          source: http://gf.cabr-fire.com/m/article-27762.htm
    params:
        check:
          kind: thresholdCompare
          valueField: maxStorage
          limitField: threshold
          verdictField: majorSource
          overValues: ["是","Y","yes","true","构成","重大危险源","√"]
          atMostValues: ["否","N","no","false","不构成","未构成"]
          tolerance: 0
    note: >-
      "储存量与临界量的大小关系"与"是否重大危险源"必须一致，这是**定义性判断**。
      本次未取得明文条号，故封顶 warn。
      ⚠️ **本条只按台账自己写的临界量做比较**，因此它**发现不了三类错误**：
      ① 临界量取错了品种或危险性类别；② GB 18218 规定的**多品种校正**
      （同一单元内 S = q1/Q1 + q2/Q2 + … + qn/Qn ≥ 1 亦构成重大危险源）**本条不做**；
      ③ 实际存在量按**设计最大量**确定（GB 18218—2018 4.2.2 原文「危险化学品储罐以及其他容器、设备或仓储区的危险化学品的实际存在量按设计最大量确定」），而台账可能记的是库存量。
      这三项都需要按标准逐单元计算，是安全评价与主管部门认定的事项。
      本条命中的含义仅限于"**你写的两个数与你的判定对不上**"，请据此复核台账本身。

  - id: HZ-004
    title: 台账应填写临界量
    severity: warn
    basis:
      document: 《危险化学品重大危险源辨识》
      number: 国务院令第591号（2002年1月26日国务院令第344号公布，2011年2月16日国务院第144次常务会议修订通过，自2011年12月1日起施行）
      clause: 第十九条末款——临界量是本制度的核心量
      excerpt: 本条例所称重大危险源，是指生产、储存、使用或者搬运危险化学品，且危险化学品的数量等于或者超过临界量的单元（包括场所和设施）。
      kind: derived-from-principle
      source: https://www.gov.cn/zhengce/2011-03/11/content_2602576.htm
    params:
        check:
          kind: presence
          field: threshold
          fix: 补填临界量；本条只核对是否填写，不判断取值是否正确
    note: >-
      不写临界量的辨识台账等于没有辨识依据 —— 判定也就无从复核。
      本次未取得明文条号，故封顶 warn。
      ⚠️ **本插件不内置 GB 18218 的临界量表**，因此本条**只核对"是否写了"**，
      **不核对"写的是不是该品种的临界量"** —— 那需要查标准表并按危险性类别取值，本插件不做。

  - id: HZ-005
    title: 台账应声明辨识依据
    severity: warn
    basis:
      document: 《危险化学品重大危险源辨识》
      number: GB 18218—2018（本次未取得条文）
      clause: 关于辨识依据的条款（本次未取得条号）
      excerpt: 该条文本次未取得：核查未获得该文件的逐字原文，本规则库不伪造引文。
      kind: derived-from-principle
      source: https://gf.cabr-fire.com/m/article-27761.htm
    params:
        check:
          kind: headerPresence
          fields: ["basis"]
    note: >-
      辨识所依据的标准版本与名录版本会更新：不写明依据，
      多年后无法判断这份辨识是按哪一版做的。本次未取得明文条号，故封顶 warn。
      配置项 basis 对应材料表头的辨识依据（例如 GB 18218—2018 与所用名录版本）。
      ⚠️ 本条只核对表头是否声明依据，**不核对所声明版本是否为现行版本**。

  - id: HZ-006
    title: 有储存量的应填写安全技术说明书编号
    severity: warn
    basis:
      document: 《危险化学品安全管理条例》
      number: 国务院令第591号（2002年1月26日国务院令第344号公布，2011年2月16日国务院第144次常务会议修订通过，自2011年12月1日起施行）
      clause: 第十五条——化学品安全技术说明书及其内容应当符合国家标准的要求
      excerpt: 危险化学品生产企业应当提供与其生产的危险化学品相符的化学品安全技术说明书，并在危险化学品包装（包括外包装件）上粘贴或者拴挂与包装内危险化学品相符的化学品安全标签。化学品安全技术说明书和化学品安全标签所载明的内容应当符合国家标准的要求。
      kind: derived-from-principle
      source: https://www.gov.cn/zhengce/2011-03/11/content_2602576.htm
    params:
        check:
          kind: conditionalPresence
          conditionField: maxStorage
          requiredFields: ["sdsNo"]
          conditionValues: []
          fix: 补填安全技术说明书编号；本条只核对是否记录
    note: >-
      安全技术说明书（SDS）是**危险化学品的"身份证"**：不记录编号，
      现场处置与培训就失去了权威依据。本次未取得明文条号，故封顶 warn。
      本条**只在储存量已填写时**要求 SDS 编号。
      本条只核对编号栏是否填写，**不判断该说明书是否完整、是否与该化学品对应**。

  - id: HZ-007
    title: 化学品名称与 CAS 号不应重复登记
    severity: warn
    basis:
      document: 《危险化学品安全管理条例》
      number: 国务院令第591号（本次未取得条文）
      clause: 关于危险化学品登记的条款（本次未取得条号）
      excerpt: 该条文本次未取得：核查未获得该文件的逐字原文，本规则库不伪造引文。
      kind: derived-from-principle
      source: https://www.gov.cn/
    params:
        check:
          kind: unique
          field: casNo
    note: >-
      同一 CAS 号对应同一种化学物质，出现两次会让人无法判断
      是重复登记还是两个不同库房的分别盘点 —— 而储存量合计也会因此重复计算。
      本次未取得明文条号，故封顶 warn。比较时忽略空白字符。
      ⚠️ 本条按 **CAS 号**核对；若台账未填 CAS 号，本条进 skipped（**不会静默通过**）。
      同一物质分库房登记属于正常情形，此时应在储存位置栏区分并保留同一 CAS 号 ——
      若本机构台账确实这样组织，请停用本条。

  - id: HZ-008
    title: 化学品名称栏不应残留未替换的占位符
    severity: warn
    basis:
      document: 《危险化学品安全管理条例》
      number: 国务院令第591号（2002年1月26日国务院令第344号公布，2011年2月16日国务院第144次常务会议修订通过，自2011年12月1日起施行）
      clause: 第二十五条——出入库核查、登记制度，且构成重大危险源的须备案
      excerpt: 储存危险化学品的单位应当建立危险化学品出入库核查、登记制度。对剧毒化学品以及储存数量构成重大危险源的其他危险化学品，储存单位应当将其储存数量、储存地点以及管理人员的情况，报所在地县级人民政府安全生产监督管理部门（在港区内储存的，报港口行政管理部门）和公安机关备案。
      kind: derived-from-principle
      source: https://www.gov.cn/zhengce/2011-03/11/content_2602576.htm
    params:
        check:
          kind: containsAny
          field: chemicalName
          terms: ["【","】","{{","}}","XXX","xxx","待填","待补充","TBD","todo","示例"]
          fix: 化学品名称应填写实际品名；残留占位符说明台账是照模板抄的
    note: >-
      台账若直接照抄模板，名称栏留下【】、XXX、待填、TBD 之类占位符时，
      会让人误以为已经盘点了实际品种 —— **而在危化品管理中，这份台账是要拿去做辨识和备案的**。
      本次未取得明文条号，故封顶 warn。terms 可按本机构模板调整。

disabled: []
